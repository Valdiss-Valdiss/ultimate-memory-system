# folders.example.yaml — маппинг каналов → папки vault (ПРИМЕР, вымышленные значения)
# Ключ: имя канала (как в channels.json title, с точкой-префиксом если так в Telegram)
# Значение: целевая папка в vault (обязательно завершающий слэш)
# pc_catchup ведёт этот файл автоматически (merge); ручные строки сохраняются.

.канал-раз: "Заметки-1/"
.канал-два: "Темы/Пример/"
.канал-три: "Прочее/"

# Фолбэк: канал без маппинга → корневая папка по имени канала (slugify).
