<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открыть в Obsidian</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#1e1e1e;color:#ddd;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
main{max-width:620px;padding:24px;text-align:center}
h2{font-weight:600;margin:0 0 12px}
code{color:#b9b9b9;word-break:break-all;font-size:14px}
a.btn{display:inline-block;margin:22px 0 14px;padding:14px 30px;background:#7c3aed;color:#fff;border-radius:10px;text-decoration:none;font-size:18px}
p.small{color:#8a8a8a;font-size:13px;line-height:1.5}
</style></head>
<body><main>
<h2>Заметка в Obsidian</h2>
<code id="p"></code><br>
<a class="btn" id="b" href="#">Открыть в Obsidian</a>
<p class="small">Нажмите кнопку — браузер спросит разрешение открыть Obsidian.<br>Отметьте «Всегда разрешать» для этого сайта — дальше хватит одного нажатия.</p>
</main>
<script>
// Имена хранилища (vault) в Obsidian на компьютере и на телефоне — замените на свои.
var VAULT_DESKTOP = "Obsidian Vault";
var VAULT_MOBILE = "Obsidian";
var q = location.search.slice(1);
if (/^[A-Za-z0-9%._~-]+$/.test(q)) {
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var u = "obsidian://open?vault=" + encodeURIComponent(mobile ? VAULT_MOBILE : VAULT_DESKTOP) + "&file=" + q;
  document.getElementById("b").href = u;
  try { document.getElementById("p").textContent = decodeURIComponent(q) + ".md"; } catch (e) {}
  location.href = u;
} else {
  document.getElementById("p").textContent = "Неверная ссылка";
  document.getElementById("b").style.display = "none";
}
</script>
</body></html>
