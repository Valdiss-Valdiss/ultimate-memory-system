# docker-compose.yml — Memory System (серверная часть)
# Все секреты — через .env (см. .env.example). НИКОГДА не коммитить реальный .env.
# Сеть: общая bridge-сеть стека; наружу открывать только реверс-прокси (Caddy/nginx + HTTPS).

name: memory-stack

networks:
  memnet:
    driver: bridge

volumes:
  couchdb-data:
  qdrant-data:
  tg-cache:
  tg-staging:
  mirror-vault:
  mcp-logs:
  bm25-state:
  # neo4j-data:  # (запланировано: графовый слой — см. блок ниже и ARCHITECTURE.md)

services:

  couchdb:
    image: couchdb:3.4
    container_name: memory_couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks: [memnet]
    # Порт наружу НЕ публиковать без HTTPS-реверс-прокси и авторизации.
    # LiveSync-клиенты ходят через https://<домен>/couchdb (см. runbook-vps-setup).
    healthcheck:
      # ВАЖНО: `curl -f /_up` возвращает 401 (нужна авторизация) → docker помечает
      # контейнер как unhealthy → внешние autoheal-механизмы (в т.ч. у хостера)
      # начинают его перезапускать, и синк рвётся. Поэтому «жив» = сервер отвечает
      # ЛЮБЫМ кодом (200 или 401). Меняйте только вместе с пониманием последствий.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5984/_up | grep -Eq '^(200|401)$'"]
      interval: 60s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memory_qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [memnet]

  tei:
    # локальный сервер эмбеддингов (e5-small — лёгкий, ~2 GB RAM)
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: memory_tei
    restart: unless-stopped
    command: ["--model-id", "intfloat/multilingual-e5-small", "--max-client-batch-size", "32"]
    volumes:
      - tei-cache:/data
    networks: [memnet]

  docling:
    # конвертер PDF/DOCX → текст (+OCR); общий, порт 5001
    image: quay.io/docling-project/docling-serve:latest
    container_name: memory_docling
    restart: unless-stopped
    networks: [memnet]

  tgapi:
    # локальный Telegram Bot API сервер (быстрая загрузка медиа)
    image: aiogram/telegram-bot-api:latest
    container_name: memory_tgapi
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
    volumes:
      - tgapi-files:/var/lib/telegram-bot-api
    command: ["--local", "--api-id", "${API_ID}", "--api-hash", "${API_HASH}",
              "--dir=/var/lib/telegram-bot-api"]
    networks: [memnet]

  tg_bot:
    # watcher каналов: новые посты → staging → enrich
    build: ./bot
    container_name: memory_tg_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - MIRROR_DIR=/mirror
    volumes:
      - tg-staging:/staging
      - mirror-vault:/mirror
      - tg-cache:/cache
    depends_on: [tgapi]
    networks: [memnet]

  tg_media:
    # загрузчик медиа-вложений по запросу конвейера
    build: ./bot
    container_name: memory_tg_media
    restart: unless-stopped
    env_file: .env
    environment:
      - LOCAL_TG_API_URL=http://tgapi:8081
    volumes:
      - tg-staging:/staging
      - tg-cache:/cache
    depends_on: [tgapi]
    networks: [memnet]

  indexer:
    # семантический индекс зеркала → Qdrant (чанки ~1300 симв.)
    build: ./bot
    container_name: memory_indexer
    restart: unless-stopped
    env_file: .env
    environment:
      - MIRROR_DIR=/mirror
      - TEI_URL=http://tei:80
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-vault_main}
    volumes:
      - mirror-vault:/mirror
    depends_on: [qdrant, tei]
    networks: [memnet]

  netguard_ssh22:
    # SSH rate-limit (см. runbook-ssh-hygiene.md); требует root-права контейнера.
    # Порог 30 новых соединений/60с: парольная аутентификация в sshd выключена
    # (только ключи), поэтому порог защищает не от взлома, а от шума ботов.
    # Если машина ходит в сеть через VPN с разными выходными IP — используйте
    # автосинх whitelist: vps/scripts/sync-whitelist.sh + канари на ПК
    # (pc-scripts/health_canary.py) публикуют текущий IP в заметку.
    image: alpine:latest
    container_name: netguard_ssh22
    restart: always
    privileged: true
    network_mode: host
    command: >
      sh -c "apk add -q iptables &&
      R0='-s ${PC_WHITELIST_IP} -p tcp --dport 22 -j ACCEPT';
      R1='-p tcp --dport 22 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT';
      R2='-p tcp --dport 22 -m conntrack --ctstate NEW -m recent --set --name SSHRATE';
      R3='-p tcp --dport 22 -m conntrack --ctstate NEW -m recent --update --name SSHRATE --seconds 60 --hitcount 30 -j DROP';
      iptables -C INPUT $$R0 2>/dev/null || iptables -I INPUT 1 $$R0;
      iptables -C INPUT $$R1 2>/dev/null || iptables -I INPUT 2 $$R1;
      iptables -C INPUT $$R2 2>/dev/null || iptables -I INPUT 3 $$R2;
      iptables -C INPUT $$R3 2>/dev/null || iptables -I INPUT 4 $$R3;
      echo RULES-APPLIED; while true; do sleep 3600; done"

  # ── Память для ИИ-агентов: memory-MCP + словесный индекс BM25 (v0.2.0) ──────
  # Сервер MCP даёт агентам (opencode / Hermes / Claude …) поиск и чтение всего
  # зеркала vault, а запись — ТОЛЬКО в свою зону Inbox/<агент>/.
  # Наружу — только через реверс-прокси с токеном: vps/caddy/memory-mcp.caddy.example.
  # Подробно: vps/mcp/README.md и docs/runbooks/runbook-memory-mcp.md.
  mcp:
    build: ./mcp
    image: memory-mcp:latest
    container_name: memory_mcp
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault
      - INBOX_PREFIX=Inbox/AI/            # зона записи этого агента
      - AUDIT_LOG=/var/log/memory-mcp/audit.log
      - MCP_PORT=8765
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - TEI_URL=http://tei:80
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-vault_main}
      - QDRANT_BM25_COLLECTION=${QDRANT_BM25_COLLECTION:-vault_bm25}
      - EXPAND_URL=${EXPAND_URL}
      - EXPAND_MODELS=${EXPAND_MODELS}
      - SUMMARY_MODEL=${SUMMARY_MODEL}
      - OBSIDIAN_VAULT_NAME=${OBSIDIAN_VAULT_NAME:-Obsidian Vault}
      - OBSIDIAN_BRIDGE=${OBSIDIAN_BRIDGE}
    volumes:
      - mirror-vault:/vault
      - mcp-logs:/var/log/memory-mcp
      - ./secrets/mcp-llm-key:/llm-key:ro   # ключи LLM для расширения запроса/обобщения, по одному в строке
    ports:
      - "127.0.0.1:8765:8765"               # только localhost; наружу — через прокси с токеном
    depends_on: [qdrant, tei]
    networks: [memnet]

  # Второй агент = второй экземпляр того же образа со СВОЕЙ зоной записи и своим логом.
  # mcp_hermes:
  #   image: memory-mcp:latest
  #   container_name: memory_mcp_hermes
  #   restart: unless-stopped
  #   environment: (как у mcp, но INBOX_PREFIX=Inbox/Hermes/ и AUDIT_LOG=…/audit-hermes.log)
  #   volumes: (как у mcp)
  #   ports: ["127.0.0.1:8766:8765"]
  #   networks: [memnet]

  bm25:
    # словесный индекс (BM25, русская/английская морфология): заметка = одна точка в Qdrant
    image: memory-mcp:latest
    container_name: memory_bm25
    restart: unless-stopped
    command: ["python", "-m", "src.bm25_indexer"]
    environment:
      - VAULT_PATH=/vault
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_BM25_COLLECTION=${QDRANT_BM25_COLLECTION:-vault_bm25}
      - BM25_INTERVAL=300
    volumes:
      - mirror-vault:/vault:ro
      - bm25-state:/state
    depends_on: [mcp, qdrant]
    networks: [memnet]

  # ── ЗАПЛАНИРОВАНО (следующая версия): графовый слой ────────────────────────
  # Включение: раскомментировать блок + добавить NEO4J_PASSWORD в .env.
  # Имя хоста в сети зарезервировано: neo4j (bolt://neo4j:7687, внутри memnet).
  # RAM: закладывай ~1–1.5 GiB (см. таблицу бюджета в vps/README.md).
  #
  # neo4j:
  #   image: neo4j:5-community
  #   container_name: memory_neo4j
  #   restart: unless-stopped
  #   environment:
  #     - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
  #     - NEO4J_server_memory_heap_initial__size=512m
  #     - NEO4J_server_memory_heap_max__size=1024m
  #     - NEO4J_server_memory_pagecache_size=256m
  #   volumes:
  #     - neo4j-data:/data
  #   networks: [memnet]
  #   # Веб-интерфейс (7474) наружу — только через реверс-прокси с авторизацией.
  #   # Bolt (7687) — только внутри сети memnet.

volumes:
  tei-cache:
  tgapi-files:
